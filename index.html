<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Telegram Multi-File Game</title>
    
    <!-- Telegram SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- Стили -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>

        <div id="ui-overlay" class="overlay">
            <div id="ui-title" class="title">ARENA SURVIVAL</div>
            <div id="ui-score" class="score-info">Уворачивайся и собирай сферы!</div>
            <button id="ui-btn" class="btn-start" onclick="window.game.start()">ИГРАТЬ</button>
        </div>
    </div>

    <!-- Модульные скрипты (порядок важен) -->
    <script src="js/tg-sdk.js"></script>
    <script src="js/player.js"></script>
    <script src="js/enemies.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
