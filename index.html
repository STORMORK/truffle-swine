<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Piggy Hill Adventure HD</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #87CEEB;
        }
        
        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 15px;
            pointer-events: none;
        }

        .top-bar, .menu-panel {
            pointer-events: auto; 
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 12px;
            padding: 10px 15px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
        }
        .resource {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 16px;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }
        .resource span { color: #f1c40f; }

        .menu-panel {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 16px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            margin-bottom: env(safe-area-inset-bottom, 10px);
            transition: opacity 0.3s ease;
        }
        .pig-selector {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.1);
            padding: 10px 15px;
            border-radius: 12px;
            color: white;
        }
        .pig-name {
            font-weight: 900;
            font-size: 18px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }
        .btn-action {
            background: linear-gradient(135deg, #f39c12, #d35400);
            color: white;
            font-size: 14px;
            font-weight: bold;
            padding: 8px 14px;
            border-radius: 8px;
            border: none;
            box-shadow: 0 4px 0 #a04000;
            cursor: pointer;
        }
        .btn-action:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #a04000;
        }

        .btn-play {
            width: 100%;
            padding: 16px;
            font-size: 22px;
            font-weight: 900;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            text-transform: uppercase;
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            color: white;
            box-shadow: 0 6px 0 #1e8449, 0 10px 20px rgba(0,0,0,0.5);
            transition: all 0.1s;
        }
        .btn-play:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 #1e8449;
        }
        
        .distance-hud {
            position: absolute;
            top: 70px;
            right: 15px;
            background: rgba(0,0,0,0.5);
            color: white;
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <div class="ui-layer">
        <div class="top-bar">
            <div class="resource">⭐ <span id="lvlText">Ур. 1</span></div>
            <div class="resource">🪙 <span id="coinsText">12</span></div>
            <div class="resource">💎 <span id="gemsText">0</span></div>
        </div>
        
        <div class="distance-hud" id="distanceHud" style="display: none;">📍 0m</div>

        <!-- Добавили id="menuPanel" чтобы скрывать его -->
        <div class="menu-panel" id="menuPanel">
            <div class="pig-selector">
                <div>
                    <div style="font-size: 11px; color: #dcdde1; text-transform: uppercase; letter-spacing: 1px;">Выбран</div>
                    <div class="pig-name" id="pigName" style="color: #ff9ff3;">Pinky Sweet</div>
                </div>
                <button class="btn-action" onclick="nextPig()">Сменить ➡️</button>
            </div>
            <button class="btn-play" id="playBtn" onclick="startGame()">ИГРАТЬ</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let gamePlaying = false;
        let canJump = false; // Защита от случайного прыжка при клике на "Играть"
        let scoreCoins = 12;
        let distance = 0;
        let time = 0;

        const pigs = [
            { name: "Pinky Sweet", color1: "#ffb8b8", color2: "#ff9ff3", spot: "#ff4d4d" },
            { name: "Dirty Piggy", color1: "#e1b12c", color2: "#e77f67", spot: "#8c7ae6" },
            { name: "Wild Boar", color1: "#7f8fa6", color2: "#353b48", spot: "#2f3640" }
        ];
        let currentPigIndex = 0;

        // Добавили физику: скорость по Y (vy) и состояние "на земле"
        let pig = { x: 0, y: 0, vy: 0, isGrounded: true };
        let gravity = 0.7;    // Сила притяжения
        let jumpPower = -13;  // Сила прыжка

        let hillOffset = 0;
        let coinsList = [];
        let clouds = [];

        for(let i=0; i<6; i++) {
            clouds.push({
                x: Math.random() * window.innerWidth * 2,
                y: Math.random() * (window.innerHeight * 0.4),
                size: 30 + Math.random() * 40,
                speed: 0.2 + Math.random() * 0.5
            });
        }

        function nextPig() {
            currentPigIndex = (currentPigIndex + 1) % pigs.length;
            let currentPig = pigs[currentPigIndex];
            document.getElementById('pigName').innerText = currentPig.name;
            document.getElementById('pigName').style.color = currentPig.color2;
        }

        function startGame() {
            gamePlaying = true;
            // Скрываем меню
            document.getElementById('menuPanel').style.display = 'none';
            document.getElementById('distanceHud').style.display = "block";
            
            distance = 0;
            coinsList = [];
            pig.vy = 0;

            // Разрешаем прыгать через долю секунды, чтобы кнопка "Играть" не вызвала прыжок
            setTimeout(() => { canJump = true; }, 100);
        }

        // Обработчик касания экрана для прыжка
        window.addEventListener('pointerdown', () => {
            if (gamePlaying && canJump && pig.isGrounded) {
                pig.vy = jumpPower;      // Придаем скорость вверх
                pig.isGrounded = false;  // Свинка в воздухе
            }
        });

        function getHillHeight(x, frequency, amplitude, baseHeight) {
            return baseHeight + Math.sin(x * frequency) * amplitude + Math.cos(x * frequency * 0.5) * (amplitude/2);
        }

        function update() {
            time += 0.1;
            
            clouds.forEach(c => {
                c.x -= c.speed;
                if(c.x < -100) c.x = canvas.width + 100;
            });

            pig.x = canvas.width * 0.25; 
            let baseTerrainHeight = canvas.height * 0.65;
            let targetY = getHillHeight(pig.x + hillOffset, 0.005, 80, baseTerrainHeight);
            let groundY = targetY - 25; // Уровень земли для свинки

            if (gamePlaying) {
                let speed = 5;
                hillOffset += speed;
                distance += speed * 0.02;
                document.getElementById('distanceHud').innerText = `📍 ${Math.floor(distance)}m`;

                // --- ФИЗИКА ПРЫЖКА ---
                pig.vy += gravity; // Гравитация тянет вниз
                pig.y += pig.vy;   // Меняем позицию по Y

                // Проверка столкновения с землей (холмом)
                if (pig.y >= groundY) {
                    pig.y = groundY;
                    pig.vy = 0;
                    pig.isGrounded = true;
                } else {
                    pig.isGrounded = false;
                }

                if (coinsList.length < 5 && Math.random() < 0.03) {
                    let lastX = coinsList.length > 0 ? coinsList[coinsList.length - 1].x : hillOffset + canvas.width;
                    coinsList.push({
                        x: lastX + 150 + Math.random() * 200,
                        y: getHillHeight(lastX + 150, 0.005, 80, baseTerrainHeight) - 70
                    });
                }

                for (let i = coinsList.length - 1; i >= 0; i--) {
                    let c = coinsList[i];
                    let screenX = c.x - hillOffset;
                    
                    let distToPig = Math.hypot(screenX - pig.x, c.y - pig.y);
                    if (distToPig < 45) {
                        scoreCoins++;
                        document.getElementById('coinsText').innerText = scoreCoins;
                        coinsList.splice(i, 1);
                    } else if (screenX < -50) {
                        coinsList.splice(i, 1);
                    }
                }
            } else {
                // В меню свинка стоит ровно на земле и дышит
                pig.y = groundY + Math.sin(time)*2;
            }
        }

        function drawCloud(x, y, size) {
            ctx.fillStyle = "rgba(255, 255, 255, 0.8)";
            ctx.beginPath();
            ctx.arc(x, y, size, 0, Math.PI * 2);
            ctx.arc(x + size*0.8, y - size*0.3, size*0.8, 0, Math.PI * 2);
            ctx.arc(x + size*1.5, y, size*0.9, 0, Math.PI * 2);
            ctx.fill();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            let skyGrad = ctx.createLinearGradient(0, 0, 0, canvas.height * 0.6);
            skyGrad.addColorStop(0, '#4facfe');
            skyGrad.addColorStop(1, '#00f2fe');
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "rgba(255, 234, 167, 0.9)";
            ctx.shadowBlur = 40;
            ctx.shadowColor = "#fdcb6e";
            ctx.beginPath();
            ctx.arc(canvas.width * 0.8, canvas.height * 0.2, 40, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            clouds.forEach(c => drawCloud(c.x, c.y, c.size));

            let baseH = canvas.height * 0.65;

            ctx.fillStyle = '#74b9ff';
            ctx.beginPath();
            ctx.moveTo(0, canvas.height);
            for (let x = 0; x <= canvas.width; x += 10) {
                let hY = getHillHeight(x + hillOffset * 0.2, 0.008, 120, baseH - 50);
                ctx.lineTo(x, hY);
            }
            ctx.lineTo(canvas.width, canvas.height);
            ctx.fill();

            ctx.fillStyle = '#0984e3';
            ctx.beginPath();
            ctx.moveTo(0, canvas.height);
            for (let x = 0; x <= canvas.width; x += 10) {
                let hY = getHillHeight(x + hillOffset * 0.5, 0.006, 100, baseH - 10);
                ctx.lineTo(x, hY);
            }
            ctx.lineTo(canvas.width, canvas.height);
            ctx.fill();

            let groundGrad = ctx.createLinearGradient(0, baseH - 100, 0, canvas.height);
            groundGrad.addColorStop(0, '#e17055');
            groundGrad.addColorStop(1, '#d63031');

            ctx.beginPath();
            ctx.moveTo(0, canvas.height);
            for (let x = 0; x <= canvas.width; x += 5) {
                let hY = getHillHeight(x + hillOffset, 0.005, 80, baseH);
                ctx.lineTo(x, hY);
            }
            ctx.lineTo(canvas.width, canvas.height);
            ctx.fillStyle = groundGrad;
            ctx.fill();

            ctx.beginPath();
            for (let x = 0; x <= canvas.width; x += 5) {
                let hY = getHillHeight(x + hillOffset, 0.005, 80, baseH);
                if(x === 0) ctx.moveTo(x, hY);
                else ctx.lineTo(x, hY);
            }
            ctx.lineWidth = 14;
            ctx.strokeStyle = '#00b894';
            ctx.stroke();
            ctx.lineWidth = 4;
            ctx.strokeStyle = '#55efc4';
            ctx.stroke();

            ctx.fillStyle = '#f1c40f';
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            for (let c of coinsList) {
                let screenX = c.x - hillOffset;
                if (screenX > -30 && screenX < canvas.width + 30) {
                    let scale = 1 + Math.sin(time * 3 + c.x) * 0.1;
                    ctx.beginPath();
                    ctx.arc(screenX, c.y + Math.sin(time*2)*5, 12 * scale, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.arc(screenX, c.y + Math.sin(time*2)*5, 6 * scale, 0, Math.PI * 2);
                    ctx.strokeStyle = '#d35400';
                    ctx.stroke();
                }
            }

            let currentPig = pigs[currentPigIndex];
            ctx.save();
            ctx.translate(pig.x, pig.y);

            // Тень рисуем только если свинка на земле, либо делаем прозрачнее в прыжке
            if (pig.isGrounded) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
                ctx.beginPath();
                ctx.ellipse(0, 22, 20, 6, 0, 0, Math.PI * 2);
                ctx.fill();
            }

            // В прыжке лапки не двигаются, и нет покачивания тела
            let bounce = (gamePlaying && pig.isGrounded) ? Math.sin(time * 4) * 3 : 0;
            let legSwing = (gamePlaying && pig.isGrounded) ? Math.sin(time * 6) * 10 : 0;

            // Если свинка летит вверх - она немного задирает нос, если падает - клюет носом
            let tilt = 0;
            if (!pig.isGrounded) {
                tilt = pig.vy * 0.03; 
            }

            ctx.translate(0, bounce);
            ctx.rotate(tilt);

            ctx.fillStyle = currentPig.color1;
            ctx.fillRect(-12 + legSwing/2, 10, 6, 12);
            ctx.fillRect(8 - legSwing/2, 10, 6, 12);

            ctx.beginPath();
            ctx.arc(-22, -2, 5, 0, Math.PI);
            ctx.strokeStyle = currentPig.color1;
            ctx.lineWidth = 3;
            ctx.stroke();

            let bodyGrad = ctx.createLinearGradient(0, -20, 0, 20);
            bodyGrad.addColorStop(0, currentPig.color1);
            bodyGrad.addColorStop(1, currentPig.color2);
            
            ctx.beginPath();
            ctx.ellipse(0, 0, 24, 18, 0, 0, Math.PI * 2);
            ctx.fillStyle = bodyGrad;
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#fff';
            ctx.stroke();

            ctx.fillStyle = currentPig.spot;
            ctx.beginPath();
            ctx.ellipse(-8, -6, 8, 5, Math.PI/4, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = currentPig.color2;
            ctx.beginPath();
            ctx.ellipse(10, -16, 6, 8, Math.PI/6, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = currentPig.color2;
            ctx.fillRect(-6 - legSwing, 12, 6, 12);
            ctx.fillRect(14 + legSwing, 12, 6, 12);

            ctx.fillStyle = '#ff7675';
            ctx.beginPath();
            ctx.ellipse(22, 2, 6, 8, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = '#d63031';
            ctx.fillRect(24, 0, 2, 2);
            ctx.fillRect(24, 4, 2, 2);

            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.arc(12, -6, 5, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = 'black';
            ctx.beginPath();
            ctx.arc(14, -6, 2.5, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
