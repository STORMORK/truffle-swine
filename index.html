<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Truffle Swine</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #2c3e50;
      color: #ffffff;
      margin: 0;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 95vh;
      box-sizing: border-box;
      user-select: none;
    }

    .card {
      background: #34495e;
      border-radius: 20px;
      padding: 20px;
      width: 100%;
      max-width: 360px;
      text-align: center;
      box-shadow: 0 10px 20px rgba(0,0,0,0.3);
      border: 2px solid #27ae60;
    }

    h1 {
      font-size: 24px;
      margin: 5px 0;
      color: #f1c40f;
    }

    .pig-avatar {
      font-size: 70px;
      margin: 15px 0;
      cursor: pointer;
      transition: transform 0.1s;
    }

    .pig-avatar:active {
      transform: scale(0.9);
    }

    .stats-container {
      background: #1e2b37;
      border-radius: 12px;
      padding: 12px;
      margin: 15px 0;
      display: flex;
      justify-content: space-around;
    }

    .stat-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .stat-val {
      font-size: 18px;
      font-weight: bold;
      color: #2ecc71;
    }

    .stat-label {
      font-size: 11px;
      color: #bdc3c7;
    }

    .btn {
      background-color: #27ae60;
      color: #ffffff;
      border: none;
      padding: 14px 20px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      width: 100%;
      cursor: pointer;
      margin-top: 8px;
      box-shadow: 0 4px 0 #1e8449;
    }

    .btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #1e8449;
    }

    .btn-sell {
      background-color: #e67e22;
      box-shadow: 0 4px 0 #d35400;
    }

    .btn-upgrade {
      background-color: #2980b9;
      box-shadow: 0 4px 0 #1f618d;
    }

    .log {
      font-size: 13px;
      color: #f39c12;
      margin-top: 10px;
      min-height: 20px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>🐷 TRUFFLE SWINE</h1>
    <p style="opacity: 0.8; font-size: 12px; margin-top: 0;">Ферма трюфельных свинок</p>

    <div class="pig-avatar" id="pig">🐷</div>
    <div class="log" id="logText">Нажми на свинку или отправь в лес!</div>

    <div class="stats-container">
      <div class="stat-item">
        <span class="stat-label">Монеты</span>
        <span class="stat-val">💰 <span id="coins">0</span></span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Трюфели</span>
        <span class="stat-val">🍄 <span id="truffles">0</span></span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Нюх (Ур.)</span>
        <span class="stat-val">⭐ <span id="pigLvl">1</span></span>
      </div>
    </div>

    <button class="btn" id="searchBtn">🌲 Искать трюфели в лесу</button>
    <button class="btn btn-sell" id="sellBtn">⚖️ Продать трюфели</button>
    <button class="btn btn-upgrade" id="upgradeBtn">🧬 Прокачать Нюх (15 💰)</button>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    let coins = 0;
    let truffles = 0;
    let pigLvl = 1;
    let upgradeCost = 15;

    const coinsEl = document.getElementById('coins');
    const trufflesEl = document.getElementById('truffles');
    const pigLvlEl = document.getElementById('pigLvl');
    const logEl = document.getElementById('logText');
    const upgradeBtn = document.getElementById('upgradeBtn');

    // Клик по свинье
    document.getElementById('pig').addEventListener('click', () => {
      if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
      logEl.innerText = "Хрю-хрю! 🐽";
    });

    // Поход в лес
    document.getElementById('searchBtn').addEventListener('click', () => {
      // Шанс найти зависит от уровня
      let found = Math.floor(Math.random() * pigLvl) + 1;
      truffles += found;
      trufflesEl.innerText = truffles;
      
      logEl.innerText = `🌲 Свинка хрюкнула и нашла ${found} трюфель(ей)!`;
      if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
    });

    // Продажа
    document.getElementById('sellBtn').addEventListener('click', () => {
      if (truffles > 0) {
        let earned = truffles * 5; // Каждый трюфель = 5 монет
        coins += earned;
        logEl.innerText = `⚖️ Продано ${truffles} трюфелей за ${earned} монет!`;
        truffles = 0;
        
        coinsEl.innerText = coins;
        trufflesEl.innerText = truffles;
        if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
      } else {
        logEl.innerText = "У вас нет трюфелей для продажи!";
      }
    });

    // Прокачка свиньи
    upgradeBtn.addEventListener('click', () => {
      if (coins >= upgradeCost) {
        coins -= upgradeCost;
        pigLvl += 1;
        upgradeCost = Math.round(upgradeCost * 1.8);

        coinsEl.innerText = coins;
        pigLvlEl.innerText = pigLvl;
        upgradeBtn.innerText = `🧬 Прокачать Нюх (${upgradeCost} 💰)`;
        logEl.innerText = `⭐ Нюх прокачан до ${pigLvl} уровня!`;

        if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
      } else {
        logEl.innerText = "Не хватает монет для прокачки!";
      }
    });
  </script>
</body>
</html>
