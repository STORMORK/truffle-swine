<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Super Piggy Bros</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none; /* Отключаем стандартные жесты браузера */
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        
        /* Холст адаптируется под любой экран телефона, сохраняя пропорции */
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 1;
        }

        /* UI слой поверх игры */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            padding: 15px;
            font-size: 20px;
            font-weight: 900;
            color: white;
            text-shadow: 2px 2px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
        }
        .score span { color: #f1c40f; }

        /* Кнопки управления */
        .controls {
            display: flex;
            justify-content: space-between;
            padding: 20px;
            padding-bottom: env(safe-area-inset-bottom, 30px);
            pointer-events: auto;
        }
        
        .d-pad {
            display: flex;
            gap: 10px;
        }

        .btn {
            width: 70px;
            height: 70px;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            color: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: background 0.1s;
        }
        .btn:active {
            background: rgba(255, 255, 255, 0.5);
        }
        .btn-jump {
            width: 80px;
            height: 80px;
            border-radius: 20px;
            background: rgba(231, 76, 60, 0.3);
            border-color: rgba(231, 76, 60, 0.7);
        }
        .btn-jump:active {
            background: rgba(231, 76, 60, 0.7);
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas" width="400" height="700"></canvas>

    <div class="ui-layer">
        <div class="top-bar">
            <div class="score">SUPER PIGGY</div>
            <div class="score">🪙 <span id="coinsText">0</span></div>
        </div>
        
        <div class="controls">
            <div class="d-pad">
                <div class="btn" id="btnLeft">◀</div>
                <div class="btn" id="btnRight">▶</div>
            </div>
            <div class="btn btn-jump" id="btnJump">A</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Внутренние константы игры
        const GRAVITY = 0.6;
        const FRICTION = 0.8;
        const JUMP_POWER = -12;
        const MOVE_SPEED = 1.5;
        const MAX_SPEED = 6;

        let scoreCoins = 0;
        let time = 0;
        let cameraX = 0;

        // Ввод пользователя
        const keys = { left: false, right: false, jump: false };

        // Привязка сенсорных кнопок
        function bindBtn(id, key) {
            const el = document.getElementById(id);
            el.addEventListener('touchstart', (e) => { e.preventDefault(); keys[key] = true; });
            el.addEventListener('touchend', (e) => { e.preventDefault(); keys[key] = false; });
            el.addEventListener('mousedown', (e) => { e.preventDefault(); keys[key] = true; });
            el.addEventListener('mouseup', (e) => { e.preventDefault(); keys[key] = false; });
            el.addEventListener('mouseleave', (e) => { e.preventDefault(); keys[key] = false; });
        }
        bindBtn('btnLeft', 'left');
        bindBtn('btnRight', 'right');
        bindBtn('btnJump', 'jump');

        // Свинка (игрок)
        let pig = {
            x: 50, y: 200, width: 34, height: 26,
            vx: 0, vy: 0,
            isGrounded: false,
            color: "#ff9ff3",
            facingRight: true
        };

        // Генерация уровня (блоки и платформы)
        const blockSize = 40;
        let blocks = [];

        function createLevel() {
            blocks = [];
            // Земля с пропастями
            for(let i=0; i<100; i++) {
                if(i !== 10 && i !== 11 && i !== 25 && i !== 26 && i !== 27) {
                    blocks.push({ x: i * blockSize, y: 600, w: blockSize, h: 200, type: 'ground' });
                }
            }
            // Платформы
            blocks.push({ x: 200, y: 450, w: blockSize*3, h: blockSize, type: 'brick' });
            blocks.push({ x: 400, y: 300, w: blockSize*4, h: blockSize, type: 'brick' });
            
            // Ящики с лутом (как в Марио)
            blocks.push({ x: 240, y: 450, w: blockSize, h: blockSize, type: 'loot_box', active: true });
            blocks.push({ x: 480, y: 300, w: blockSize, h: blockSize, type: 'loot_box', active: true });
            
            // Лестница
            blocks.push({ x: 700, y: 560, w: blockSize, h: 40, type: 'brick' });
            blocks.push({ x: 740, y: 520, w: blockSize, h: 80, type: 'brick' });
            blocks.push({ x: 780, y: 480, w: blockSize, h: 120, type: 'brick' });
        }
        createLevel();

        // Проверка столкновений (AABB)
        function checkCollision(r1, r2) {
            return (
                r1.x < r2.x + r2.w &&
                r1.x + r1.width > r2.x &&
                r1.y < r2.y + r2.h &&
                r1.y + r1.height > r2.y
            );
        }

        function update() {
            time += 0.1;

            // Управление по X
            if (keys.left) {
                pig.vx -= MOVE_SPEED;
                pig.facingRight = false;
            }
            if (keys.right) {
                pig.vx += MOVE_SPEED;
                pig.facingRight = true;
            }
            
            pig.vx *= FRICTION; // Трение
            
            // Ограничение скорости
            if (pig.vx > MAX_SPEED) pig.vx = MAX_SPEED;
            if (pig.vx < -MAX_SPEED) pig.vx = -MAX_SPEED;
            if (Math.abs(pig.vx) < 0.1) pig.vx = 0;

            // Прыжок
            if (keys.jump && pig.isGrounded) {
                pig.vy = JUMP_POWER;
                pig.isGrounded = false;
                keys.jump = false; // Требует повторного нажатия для следующего прыжка
            }

            // Гравитация
            pig.vy += GRAVITY;

            // Движение по X и проверка столкновений
            pig.x += pig.vx;
            for (let b of blocks) {
                if (checkCollision(pig, b)) {
                    if (pig.vx > 0) { // Идем вправо, врезались в левую стену
                        pig.x = b.x - pig.width;
                        pig.vx = 0;
                    } else if (pig.vx < 0) { // Идем влево, врезались в правую стену
                        pig.x = b.x + b.w;
                        pig.vx = 0;
                    }
                }
            }

            // Движение по Y и проверка столкновений
            pig.y += pig.vy;
            pig.isGrounded = false;
            
            for (let b of blocks) {
                if (checkCollision(pig, b)) {
                    if (pig.vy > 0) { // Падаем вниз, приземлились
                        pig.y = b.y - pig.height;
                        pig.vy = 0;
                        pig.isGrounded = true;
                    } else if (pig.vy < 0) { // Прыгаем вверх, ударились головой
                        pig.y = b.y + b.h;
                        pig.vy = 0;
                        
                        // Если ударили головой ящик с лутом
                        if (b.type === 'loot_box' && b.active) {
                            b.active = false;
                            scoreCoins += 5; // Выпало 5 монет
                            document.getElementById('coinsText').innerText = scoreCoins;
                            // Анимация подпрыгивания блока
                            b.y -= 10;
                            setTimeout(() => { b.y += 10; }, 100);
                        }
                    }
                }
            }

            // Пропасть (смерть/перезапуск)
            if (pig.y > 800) {
                pig.x = 50;
                pig.y = 200;
                pig.vx = 0;
                pig.vy = 0;
                createLevel(); // Восстанавливаем уровень
            }

            // Камера следит за свинкой
            let targetCameraX = pig.x - canvas.width / 3;
            if (targetCameraX < 0) targetCameraX = 0; // Не уходим за левый край
            cameraX += (targetCameraX - cameraX) * 0.1; // Плавное движение камеры
        }

        function draw() {
            // Очистка и отрисовка неба
            let skyGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            skyGrad.addColorStop(0, '#4facfe');
            skyGrad.addColorStop(1, '#00f2fe');
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            // Сдвиг всего мира на позицию камеры
            ctx.translate(-cameraX, 0);

            // Отрисовка декораций (Облака на фоне)
            ctx.fillStyle = "rgba(255,255,255,0.7)";
            ctx.beginPath();
            ctx.arc(100 + cameraX * 0.8, 100, 30, 0, Math.PI*2);
            ctx.arc(140 + cameraX * 0.8, 100, 40, 0, Math.PI*2);
            ctx.arc(180 + cameraX * 0.8, 100, 30, 0, Math.PI*2);
            ctx.fill();

            // Отрисовка блоков уровня
            for (let b of blocks) {
                if (b.x + b.w < cameraX || b.x > cameraX + canvas.width) continue; // Не рисуем то, что за экраном

                if (b.type === 'ground') {
                    ctx.fillStyle = '#d63031'; // Земля
                    ctx.fillRect(b.x, b.y, b.w, b.h);
                    ctx.fillStyle = '#00b894'; // Трава сверху
                    ctx.fillRect(b.x, b.y, b.w, 10);
                } 
                else if (b.type === 'brick') {
                    ctx.fillStyle = '#cc8e35';
                    ctx.fillRect(b.x, b.y, b.w, b.h);
                    ctx.strokeStyle = '#000';
                    ctx.lineWidth = 1;
                    ctx.strokeRect(b.x, b.y, b.w, b.h);
                }
                else if (b.type === 'loot_box') {
                    ctx.fillStyle = b.active ? '#f1c40f' : '#7f8c8d'; // Желтый или пустой(серый)
                    ctx.fillRect(b.x, b.y, b.w, b.h);
                    ctx.strokeStyle = '#000';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(b.x, b.y, b.w, b.h);
                    
                    if (b.active) {
                        ctx.fillStyle = '#000';
                        ctx.font = 'bold 24px Arial';
                        ctx.fillText('?', b.x + 12, b.y + 28);
                    }
                }
            }

            // Отрисовка Свинки
            ctx.save();
            // Свинка двигается плавно, переворачиваем её, если она идет влево
            ctx.translate(pig.x + pig.width / 2, pig.y + pig.height / 2);
            if (!pig.facingRight) ctx.scale(-1, 1);
            
            // Анимация ходьбы
            let bounce = (pig.isGrounded && Math.abs(pig.vx) > 0.5) ? Math.sin(time * 5) * 2 : 0;
            ctx.translate(0, bounce);

            // Тело
            ctx.fillStyle = pig.color;
            ctx.beginPath();
            ctx.ellipse(0, 0, 18, 14, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#fff';
            ctx.stroke();

            // Пятачок
            ctx.fillStyle = '#ff7675';
            ctx.beginPath();
            ctx.ellipse(16, 2, 5, 6, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            
            // Глаз
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.arc(8, -4, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = 'black';
            ctx.beginPath();
            ctx.arc(10, -4, 2, 0, Math.PI * 2);
            ctx.fill();

            // Лапки
            let legSwing = (pig.isGrounded && Math.abs(pig.vx) > 0.5) ? Math.sin(time * 8) * 6 : 0;
            ctx.fillStyle = '#e84393';
            ctx.fillRect(-10 - legSwing/2, 10, 4, 8); // Задняя
            ctx.fillRect(8 + legSwing, 10, 4, 8); // Передняя

            ctx.restore(); // Конец отрисовки свинки
            ctx.restore(); // Конец сдвига камеры
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
