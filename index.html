<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Truffle Swine HD</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #111;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            pointer-events: none;
            padding: 16px 20px;
            z-index: 2;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'Segoe UI', Roboto, sans-serif;
            font-size: 22px;
            font-weight: 800;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.6);
        }
        .badge {
            background: rgba(0, 0, 0, 0.35);
            padding: 6px 14px;
            border-radius: 20px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.15);
        }
        .score span { color: #ffd700; }
        
        .hint {
            position: absolute;
            bottom: 25px;
            width: 100%;
            text-align: center;
            color: rgba(255,255,255,0.65);
            font-family: sans-serif;
            font-size: 14px;
            pointer-events: none;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <div class="ui-layer">
        <div class="top-bar">
            <div class="badge">🐷 Truffle Swine</div>
            <div class="badge score">Трюфели: <span id="coinsText">0</span></div>
        </div>
    </div>
    <div class="hint">Скольжение пальцем — бег | Свайп вверх — прыжок</div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let logicalWidth, logicalHeight;
        function resizeCanvas() {
            logicalWidth = window.innerWidth;
            logicalHeight = window.innerHeight;
            const dpr = window.devicePixelRatio || 1;
            canvas.width = logicalWidth * dpr;
            canvas.height = logicalHeight * dpr;
            ctx.scale(dpr, dpr);
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Сбалансированная физика среднего темпа
        const GRAVITY = 0.55;
        const FRICTION = 0.84;
        const JUMP_POWER = -12.5;
        const MOVE_SPEED = 1.0;  
        const MAX_SPEED = 5.2;   

        let scoreCoins = 0;
        let time = 0;
        let cameraX = 0;

        // Плавное сенсорное управление
        let isTouching = false;
        let touchStartX = 0;
        let touchStartY = 0;
        let currentTouchX = 0;

        window.addEventListener('touchstart', e => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
            currentTouchX = touchStartX;
            isTouching = true;
        });

        window.addEventListener('touchmove', e => {
            if(!isTouching) return;
            currentTouchX = e.touches[0].clientX;
            let currentY = e.touches[0].clientY;
            
            // Детект свайпа вверх для прыжка
            if (currentY - touchStartY < -35 && pig.isGrounded) {
                pig.vy = JUMP_POWER;
                pig.isGrounded = false;
                touchStartY = currentY; // сброс чтобы не прыгать непрерывно
            }
        });

        window.addEventListener('touchend', () => {
            isTouching = false;
            currentTouchX = touchStartX;
        });

        // Свинка
        let pig = {
            x: 60, y: 200, 
            width: 44, height: 40, // Антропоморфная, но приземленная для платформера
            vx: 0, vy: 0,
            isGrounded: false,
            facingRight: true
        };

        const blockSize = 50;
        let blocks = [];
        let items = [];

        function createLevel() {
            blocks = [];
            items = [];
            // Земля
            for(let i=0; i<150; i++) {
                if(i !== 8 && i !== 9 && i !== 22 && i !== 23 && i !== 38 && i !== 39) {
                    blocks.push({ x: i * blockSize, y: logicalHeight - blockSize*2.2, w: blockSize, h: blockSize*4, type: 'ground' });
                }
            }
            // Платформы и ящики с правильным расположением
            blocks.push({ x: 300, y: logicalHeight - blockSize*5, w: blockSize*4, h: blockSize, type: 'brick' });
            blocks.push({ x: 350, y: logicalHeight - blockSize*5, w: blockSize, h: blockSize, type: 'loot_box', active: true, bounceTimer: 0 });
            
            blocks.push({ x: 650, y: logicalHeight - blockSize*6, w: blockSize, h: blockSize, type: 'loot_box', active: true, bounceTimer: 0 });
            blocks.push({ x: 950, y: logicalHeight - blockSize*4.5, w: blockSize*3, h: blockSize, type: 'brick' });
        }
        createLevel();

        function checkCollision(r1, r2) {
            return (
                r1.x < r2.x + r2.w &&
                r1.x + r1.width > r2.x &&
                r1.y < r2.y + r2.h &&
                r1.y + r1.height > r2.y
            );
        }

        function update() {
            time += 0.08;

            // Вычисление направления движения от пальца
            let moveDir = 0;
            if (isTouching) {
                let diff = currentTouchX - touchStartX;
                if (diff > 15) { moveDir = 1; pig.facingRight = true; }
                else if (diff < -15) { moveDir = -1; pig.facingRight = false; }
            }

            if (moveDir !== 0) {
                pig.vx += moveDir * MOVE_SPEED;
            } else {
                pig.vx *= FRICTION;
            }

            if (pig.vx > MAX_SPEED) pig.vx = MAX_SPEED;
            if (pig.vx < -MAX_SPEED) pig.vx = -MAX_SPEED;
            if (Math.abs(pig.vx) < 0.1) pig.vx = 0;

            pig.vy += GRAVITY;

            // Движение по X
            pig.x += pig.vx;
            for (let b of blocks) {
                if (checkCollision(pig, b)) {
                    if (pig.vx > 0) { pig.x = b.x - pig.width; pig.vx = 0; } 
                    else if (pig.vx < 0) { pig.x = b.x + b.w; pig.vx = 0; }
                }
            }

            // Движение по Y
            pig.y += pig.vy;
            pig.isGrounded = false;
            
            for (let b of blocks) {
                if (checkCollision(pig, b)) {
                    if (pig.vy > 0) { // Падение / приземление сверху
                        pig.y = b.y - pig.height;
                        pig.vy = 0;
                        pig.isGrounded = true;
                    } else if (pig.vy < 0) { // Удар снизу головой в блок
                        pig.y = b.y + b.h;
                        pig.vy = 0;
                        
                        if (b.type === 'loot_box' && b.active) {
                            b.active = false;
                            b.bounceTimer = 14; // Запуск анимации подпрыгивания блока
                            
                            // Спавн трюфеля точно над блоком с красивым вылетом вверх
                            items.push({
                                x: b.x + blockSize / 2 - 14,
                                y: b.y - 30,
                                w: 28, h: 28,
                                vx: (Math.random() - 0.5) * 2.5,
                                vy: -6.5,
                                grounded: false
                            });
                        }
                    }
                }
            }

            // Физика и логика падающих трюфелей
            for (let i = items.length - 1; i >= 0; i--) {
                let item = items[i];
                item.vy += GRAVITY;
                item.x += item.vx;
                item.y += item.vy;

                // Столкновение трюфеля с платформами
                for (let b of blocks) {
                    if (checkCollision(item, b) && item.vy > 0) {
                        item.y = b.y - item.h;
                        item.vy = 0;
                        item.vx = 0;
                        item.grounded = true;
                    }
                }

                // Подбор трюфеля свинкой
                if (checkCollision(pig, item)) {
                    scoreCoins++;
                    document.getElementById('coinsText').innerText = scoreCoins;
                    items.splice(i, 1);
                }
            }

            // Провал в пропасть
            if (pig.y > logicalHeight + 100) {
                pig.x = 60; pig.y = 100;
                pig.vx = 0; pig.vy = 0;
                createLevel();
            }

            // Плавное следование камеры
            let targetCameraX = pig.x - logicalWidth * 0.38;
            if (targetCameraX < 0) targetCameraX = 0;
            cameraX += (targetCameraX - cameraX) * 0.1;
        }

        function draw() {
            // Красивый градиент неба
            let skyGrad = ctx.createLinearGradient(0, 0, 0, logicalHeight);
            skyGrad.addColorStop(0, '#2980b9');
            skyGrad.addColorStop(1, '#6dd5fa');
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, logicalWidth, logicalHeight);

            ctx.save();
            ctx.translate(-cameraX, 0);

            // Параллакс облака
            ctx.fillStyle = "rgba(255, 255, 255, 0.25)";
            for(let i=0; i<15; i++) {
                ctx.beginPath();
                ctx.arc(60 + i*260 + cameraX*0.6, 100 + (i%3)*40, 45, 0, Math.PI*2);
                ctx.arc(110 + i*260 + cameraX*0.6, 100 + (i%3)*40, 65, 0, Math.PI*2);
                ctx.arc(160 + i*260 + cameraX*0.6, 100 + (i%3)*40, 40, 0, Math.PI*2);
                ctx.fill();
            }

            // Отрисовка блоков
            for (let b of blocks) {
                if (b.x + b.w < cameraX || b.x > cameraX + logicalWidth) continue;

                let drawY = b.y;
                if (b.bounceTimer > 0) {
                    drawY -= Math.sin((b.bounceTimer / 14) * Math.PI) * 10;
                    b.bounceTimer--;
                }

                ctx.shadowColor = 'rgba(0, 0, 0, 0.35)';
                ctx.shadowBlur = 8;
                ctx.shadowOffsetY = 4;

                if (b.type === 'ground') {
                    let grad = ctx.createLinearGradient(0, drawY, 0, drawY + b.h);
                    grad.addColorStop(0, '#27ae60'); // Трава
                    grad.addColorStop(0.06, '#2ecc71');
                    grad.addColorStop(0.12, '#d35400'); // Почва
                    grad.addColorStop(1, '#8e44ad');
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.roundRect(b.x, drawY, b.w, b.h + 40, 8);
                    ctx.fill();
                } 
                else if (b.type === 'brick') {
                    ctx.fillStyle = '#e67e22';
                    ctx.beginPath();
                    ctx.roundRect(b.x, drawY, b.w, b.h, 6);
                    ctx.fill();
                    ctx.strokeStyle = '#d35400';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(b.x, drawY, b.w, b.h);
                }
                else if (b.type === 'loot_box') {
                    ctx.fillStyle = b.active ? '#f1c40f' : '#95a5a6';
                    ctx.beginPath();
                    ctx.roundRect(b.x, drawY, b.w, b.h, 6);
                    ctx.fill();
                    ctx.strokeStyle = b.active ? '#f39c12' : '#7f8c8d';
                    ctx.lineWidth = 4;
                    ctx.strokeRect(b.x + 5, drawY + 5, b.w - 10, b.h - 10);
                    
                    if (b.active) {
                        ctx.fillStyle = '#d35400';
                        ctx.font = 'bold 28px Arial';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText('?', b.x + b.w/2, drawY + b.h/2 + 2);
                    }
                }
                ctx.shadowBlur = 0;
            }

            // Отрисовка трюфелей (выпавших предметов)
            for (let item of items) {
                ctx.save();
                ctx.translate(item.x + 14, item.y + 14);
                
                let grad = ctx.createRadialGradient(0, 0, 2, 0, 0, 14);
                grad.addColorStop(0, '#ffeaa7');
                grad.addColorStop(0.6, '#fdcb6e');
                grad.addColorStop(1, '#e17055');
                
                ctx.fillStyle = grad;
                ctx.shadowColor = '#ffeaa7';
                ctx.shadowBlur = 15;
                ctx.beginPath();
                ctx.arc(0, 0, 13, 0, Math.PI*2);
                ctx.fill();
                ctx.restore();
            }

            // --- СТИЛЬНАЯ HD СВИНКА (как на референсах) ---
            ctx.save();
            ctx.translate(pig.x + pig.width / 2, pig.y + pig.height);
            if (!pig.facingRight) ctx.scale(-1, 1);

            let walkAnim = (pig.isGrounded && Math.abs(pig.vx) > 0.3) ? Math.sin(time * 14) * 8 : 0;
            let breathe = Math.sin(time * 3) * 1.5;

            // Тень под свинкой
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.beginPath();
            ctx.ellipse(0, 0, 18, 5, 0, 0, Math.PI*2);
            ctx.fill();

            // Тело свинки (округленное пухлое, как в Wild Piggy)
            let bodyGrad = ctx.createRadialGradient(-4, -22 + breathe, 4, 0, -20, 24);
            bodyGrad.addColorStop(0, '#ff9ff3');
            bodyGrad.addColorStop(1, '#f368e0');
            
            ctx.fillStyle = bodyGrad;
            ctx.shadowColor = 'rgba(0,0,0,0.2)';
            ctx.shadowBlur = 6;
            ctx.beginPath();
            ctx.ellipse(0, -20 + breathe, 22, 17, 0, 0, Math.PI*2);
            ctx.fill();
            ctx.shadowBlur = 0;

            // Ушки
            ctx.fillStyle = '#ff7979';
            ctx.beginPath();
            ctx.moveTo(-10, -32 + breathe);
            ctx.lineTo(-18, -40 + breathe);
            ctx.lineTo(-8, -28 + breathe);
            ctx.fill();

            // Пятачок (выпуклый с ноздрями)
            ctx.fillStyle = '#ff6b81';
            ctx.beginPath();
            ctx.ellipse(18, -19 + breathe, 7, 5, 0, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = '#c56cf0';
            ctx.fillRect(19, -21 + breathe, 2, 2);
            ctx.fillRect(19, -18 + breathe, 2, 2);

            // Глаз
            ctx.fillStyle = '#222';
            ctx.beginPath();
            ctx.arc(10, -25 + breathe, 2.5, 0, Math.PI*2);
            ctx.fill();
            // Блик в глазу
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(11, -26 + breathe, 1, 0, Math.PI*2);
            ctx.fill();

            // Ножки с анимацией ходьбы
            ctx.fillStyle = '#f368e0';
            ctx.beginPath();
            ctx.roundRect(-10 + walkAnim, -8, 6, 9, 3);
            ctx.roundRect(4 - walkAnim, -8, 6, 9, 3);
            ctx.fill();

            ctx.restore();
            ctx.restore();
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
