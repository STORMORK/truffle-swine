<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Piggy Hill Adventure HD</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #0f0f1a;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            padding: 10px;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 8px 12px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .resource {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 14px;
            font-weight: 700;
        }
        .resource span { color: #f1c40f; }

        .game-container {
            width: 100%;
            max-width: 400px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            margin: 8px 0;
        }
        canvas {
            width: 100%;
            height: 100%;
            max-height: 520px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            background: linear-gradient(to bottom, #4a69bd, #78e08f);
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .menu-panel {
            width: 100%;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 14px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .pig-selector {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.2);
            padding: 8px 12px;
            border-radius: 10px;
        }
        .pig-name {
            font-weight: 700;
            font-size: 15px;
            color: #ff9ff3;
        }
        .btn {
            width: 100%;
            padding: 14px;
            font-size: 18px;
            font-weight: 800;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: transform 0.1s;
        }
        .btn:active { transform: scale(0.97); }
        .btn-play {
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            color: white;
        }
        .btn-action {
            background: linear-gradient(135deg, #e67e22, #d35400);
            color: white;
            font-size: 14px;
            padding: 6px 12px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="resource">⭐ <span id="lvlText">Ур. 1</span></div>
        <div class="resource">🪙 <span id="coinsText">12</span></div>
        <div class="resource">💎 <span id="gemsText">0</span></div>
    </div>

    <div class="game-container">
        <canvas id="gameCanvas" width="400" height="600"></canvas>
    </div>

    <div class="menu-panel">
        <div class="pig-selector">
            <div>
                <div style="font-size: 10px; color: #a0a0b0;">ПЕРСОНАЖ</div>
                <div class="pig-name" id="pigName">Dirty Piggy</div>
            </div>
            <button class="btn-action" onclick="nextPig()">Сменить ➡️</button>
        </div>
        <button class="btn btn-play" id="playBtn" onclick="toggleGame()">Play</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let gamePlaying = false;
        let scoreCoins = 12;
        let distance = 0;

        const pigs = [
            { name: "Dirty Piggy", color: "#e77f67" },
            { name: "Wild Piggy", color: "#596275" },
            { name: "Pinky Sweet", color: "#ff9ff3" }
        ];
        let currentPigIndex = 0;

        let pig = {
            x: 80,
            y: 350
        };

        let hillOffset = 0;
        let coinsList = [];

        function nextPig() {
            currentPigIndex = (currentPigIndex + 1) % pigs.length;
            document.getElementById('pigName').innerText = pigs[currentPigIndex].name;
        }

        function toggleGame() {
            if (!gamePlaying) {
                startGame();
            } else {
                stopGame();
            }
        }

        function startGame() {
            gamePlaying = true;
            document.getElementById('playBtn').innerText = "STOP";
            document.getElementById('playBtn').style.background = "linear-gradient(135deg, #e74c3c, #c0392b)";
            distance = 0;
            coinsList = [];
            for(let i=0; i<5; i++) {
                coinsList.push({ x: 300 + i * 120, y: 320 - Math.sin(i)*40 });
            }
        }

        function stopGame() {
            gamePlaying = false;
            document.getElementById('playBtn').innerText = "Play";
            document.getElementById('playBtn').style.background = "linear-gradient(135deg, #2ecc71, #27ae60)";
        }

        function getHillHeight(x) {
            return 400 + Math.sin(x * 0.008) * 60 + Math.cos(x * 0.003) * 30;
        }

        function update() {
            if (gamePlaying) {
                hillOffset += 4;
                distance += 0.1;

                let targetY = getHillHeight(pig.x + hillOffset);
                pig.y = targetY - 25;

                if (coinsList.length < 5 && Math.random() < 0.05) {
                    let lastX = coinsList.length > 0 ? coinsList[coinsList.length - 1].x : hillOffset + 400;
                    coinsList.push({
                        x: lastX + 150 + Math.random() * 100,
                        y: getHillHeight(lastX + 200) - 60
                    });
                }

                for (let i = coinsList.length - 1; i >= 0; i--) {
                    let c = coinsList[i];
                    let screenX = c.x - hillOffset;
                    
                    let distToPig = Math.hypot(screenX - pig.x, c.y - pig.y);
                    if (distToPig < 30) {
                        scoreCoins++;
                        document.getElementById('coinsText').innerText = scoreCoins;
                        coinsList.splice(i, 1);
                    } else if (screenX < -50) {
                        coinsList.splice(i, 1);
                    }
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            let skyGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            skyGrad.addColorStop(0, '#38adae');
            skyGrad.addColorStop(0.6, '#78e08f');
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.beginPath();
            ctx.moveTo(0, canvas.height);
            for (let x = 0; x <= canvas.width; x += 5) {
                let hY = getHillHeight(x + hillOffset);
                ctx.lineTo(x, hY);
            }
            ctx.lineTo(canvas.width, canvas.height);
            ctx.fillStyle = '#e58e26';
            ctx.fill();
            ctx.lineWidth = 4;
            ctx.strokeStyle = '#b71540';
            ctx.stroke();

            ctx.fillStyle = '#f1c40f';
            ctx.strokeStyle = '#d4ac0d';
            ctx.lineWidth = 2;
            for (let c of coinsList) {
                let screenX = c.x - hillOffset;
                if (screenX > -30 && screenX < canvas.width + 30) {
                    ctx.beginPath();
                    ctx.arc(screenX, c.y, 10, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();
                }
            }

            ctx.save();
            ctx.translate(pig.x, pig.y);
            ctx.beginPath();
            ctx.ellipse(0, 0, 22, 16, 0, 0, Math.PI * 2);
            ctx.fillStyle = pigs[currentPigIndex].color;
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#fff';
            ctx.stroke();

            ctx.fillStyle = '#ffb8b8';
            ctx.fillRect(12, -3, 7, 6);
            ctx.fillStyle = '#000';
            ctx.fillRect(8, -7, 3, 3);
            ctx.restore();

            if (gamePlaying) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
                ctx.fillRect(canvas.width - 110, 10, 100, 30);
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 14px sans-serif';
                ctx.fillText(`📍 ${Math.floor(distance)}m`, canvas.width - 95, 30);
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
