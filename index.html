<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HD Piggy Platformer</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none; /* Блокировка скролла браузера для свайпов */
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            pointer-events: none;
            padding: 20px;
            z-index: 2;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            font-family: 'Segoe UI', Roboto, sans-serif;
            font-size: 24px;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 4px 6px rgba(0,0,0,0.8);
        }
        .score span { color: #ffd700; }
        
        .hint {
            position: absolute;
            bottom: 40px;
            width: 100%;
            text-align: center;
            color: rgba(255,255,255,0.6);
            font-family: sans-serif;
            font-size: 16px;
            pointer-events: none;
            animation: fade 2s infinite alternate;
        }
        @keyframes fade {
            from { opacity: 0.3; }
            to { opacity: 0.8; }
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <div class="ui-layer">
        <div class="top-bar">
            <div class="score">HD PIGGY</div>
            <div class="score">Трюфели: <span id="coinsText">0</span></div>
        </div>
    </div>
    <div class="hint">Свайп влево/вправо — бег. Свайп вверх — прыжок</div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // Настройка HD (Retina) разрешения
        let logicalWidth, logicalHeight;
        function resizeCanvas() {
            logicalWidth = window.innerWidth;
            logicalHeight = window.innerHeight;
            const dpr = window.devicePixelRatio || 1;
            canvas.width = logicalWidth * dpr;
            canvas.height = logicalHeight * dpr;
            ctx.scale(dpr, dpr);
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Физика (замедленная и плавная)
        const GRAVITY = 0.5;
        const FRICTION = 0.85;
        const JUMP_POWER = -11;
        const MOVE_SPEED = 0.6; // Скорость набора хода
        const MAX_SPEED = 3.5;  // Максимальная скорость (снижена)

        let scoreCoins = 0;
        let time = 0;
        let cameraX = 0;

        // Управление свайпами
        let isTouching = false;
        let touchStart = { x: 0, y: 0 };
        let touchOffset = { x: 0, y: 0 };

        window.addEventListener('touchstart', e => {
            touchStart.x = e.touches[0].clientX;
            touchStart.y = e.touches[0].clientY;
            touchOffset.x = 0;
            touchOffset.y = 0;
            isTouching = true;
        });

        window.addEventListener('touchmove', e => {
            if(!isTouching) return;
            let currentX = e.touches[0].clientX;
            let currentY = e.touches[0].clientY;
            
            touchOffset.x = currentX - touchStart.x;
            touchOffset.y = currentY - touchStart.y;

            // Детект свайпа вверх для прыжка
            if (touchOffset.y < -40 && pig.isGrounded) {
                pig.vy = JUMP_POWER;
                pig.isGrounded = false;
                touchStart.y = currentY; // Сбрасываем якорь, чтобы не прыгать дважды
            }
        });

        window.addEventListener('touchend', () => {
            isTouching = false;
            touchOffset.x = 0;
        });

        // Свинка (высокая, на двух ногах)
        let pig = {
            x: 50, y: 200, 
            width: 30, height: 60, // Пропорции прямоходящего существа
            vx: 0, vy: 0,
            isGrounded: false,
            facingRight: true
        };

        const blockSize = 50;
        let blocks = [];
        let items = []; // Выпадающие предметы

        function createLevel() {
            blocks = [];
            items = [];
            // Земля
            for(let i=0; i<100; i++) {
                if(i !== 8 && i !== 9 && i !== 20 && i !== 21) {
                    blocks.push({ x: i * blockSize, y: logicalHeight - blockSize*2, w: blockSize, h: blockSize*3, type: 'ground' });
                }
            }
            // Платформы и ящики
            blocks.push({ x: 250, y: logicalHeight - blockSize*5, w: blockSize*3, h: blockSize, type: 'brick' });
            blocks.push({ x: 300, y: logicalHeight - blockSize*5, w: blockSize, h: blockSize, type: 'loot_box', active: true });
            
            blocks.push({ x: 550, y: logicalHeight - blockSize*7, w: blockSize, h: blockSize, type: 'loot_box', active: true });
            blocks.push({ x: 800, y: logicalHeight - blockSize*4, w: blockSize*2, h: blockSize, type: 'brick' });
        }
        createLevel();

        function checkCollision(r1, r2) {
            return (
                r1.x < r2.x + r2.w &&
                r1.x + r1.width > r2.x &&
                r1.y < r2.y + r2.h &&
                r1.y + r1.height > r2.y
            );
        }

        function update() {
            time += 0.1;

            // Обработка скольжения пальца
            if (isTouching) {
                if (touchOffset.x > 20) {
                    pig.vx += MOVE_SPEED;
                    pig.facingRight = true;
                } else if (touchOffset.x < -20) {
                    pig.vx -= MOVE_SPEED;
                    pig.facingRight = false;
                }
            }
            
            pig.vx *= FRICTION;
            if (pig.vx > MAX_SPEED) pig.vx = MAX_SPEED;
            if (pig.vx < -MAX_SPEED) pig.vx = -MAX_SPEED;
            if (Math.abs(pig.vx) < 0.1) pig.vx = 0;

            pig.vy += GRAVITY;

            // Движение X
            pig.x += pig.vx;
            for (let b of blocks) {
                if (checkCollision(pig, b)) {
                    if (pig.vx > 0) { pig.x = b.x - pig.width; pig.vx = 0; } 
                    else if (pig.vx < 0) { pig.x = b.x + b.w; pig.vx = 0; }
                }
            }

            // Движение Y
            pig.y += pig.vy;
            pig.isGrounded = false;
            
            for (let b of blocks) {
                if (checkCollision(pig, b)) {
                    if (pig.vy > 0) { // Приземление
                        pig.y = b.y - pig.height;
                        pig.vy = 0;
                        pig.isGrounded = true;
                    } else if (pig.vy < 0) { // Удар головой
                        pig.y = b.y + b.h;
                        pig.vy = 0;
                        
                        if (b.type === 'loot_box' && b.active) {
                            b.active = false;
                            b.bounceTimer = 10;
                            // Создаем падающий предмет
                            items.push({
                                x: b.x + 15,
                                y: b.y - 25,
                                w: 20, h: 20,
                                vy: -6, // Подкидываем вверх
                                collected: false
                            });
                        }
                    }
                }
            }

            // Физика выпадающих предметов (трюфелей)
            for (let i = items.length - 1; i >= 0; i--) {
                let item = items[i];
                item.vy += GRAVITY;
                item.y += item.vy;

                // Столкновение предмета с платформами (чтобы он лежал на блоке)
                for (let b of blocks) {
                    if (checkCollision(item, b) && item.vy > 0) {
                        item.y = b.y - item.h;
                        item.vy = 0;
                    }
                }

                // Подбор предмета свинкой
                if (checkCollision(pig, item)) {
                    scoreCoins++;
                    document.getElementById('coinsText').innerText = scoreCoins;
                    items.splice(i, 1); // Удаляем собранный предмет
                }
            }

            // Пропасть
            if (pig.y > logicalHeight + 100) {
                pig.x = 50; pig.y = 100;
                pig.vx = 0; pig.vy = 0;
                createLevel();
            }

            // Камера
            let targetCameraX = pig.x - logicalWidth * 0.4;
            if (targetCameraX < 0) targetCameraX = 0;
            cameraX += (targetCameraX - cameraX) * 0.1;
        }

        // Рисование HD графики
        function draw() {
            // Задний фон (небо)
            let skyGrad = ctx.createLinearGradient(0, 0, 0, logicalHeight);
            skyGrad.addColorStop(0, '#1e3c72');
            skyGrad.addColorStop(1, '#2a5298');
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, logicalWidth, logicalHeight);

            ctx.save();
            ctx.translate(-cameraX, 0);

            // Параллакс облака
            ctx.fillStyle = "rgba(255, 255, 255, 0.15)";
            for(let i=0; i<10; i++) {
                ctx.beginPath();
                ctx.arc(100 + i*300 + cameraX*0.7, 150 + Math.sin(i)*50, 60, 0, Math.PI*2);
                ctx.arc(160 + i*300 + cameraX*0.7, 150 + Math.sin(i)*50, 80, 0, Math.PI*2);
                ctx.arc(220 + i*300 + cameraX*0.7, 150 + Math.sin(i)*50, 50, 0, Math.PI*2);
                ctx.fill();
            }

            // Блоки уровня
            for (let b of blocks) {
                if (b.x + b.w < cameraX || b.x > cameraX + logicalWidth) continue;

                ctx.shadowColor = 'rgba(0,0,0,0.5)';
                ctx.shadowBlur = 10;
                ctx.shadowOffsetY = 5;

                // Анимация подпрыгивания пустого ящика
                let drawY = b.y;
                if (b.bounceTimer > 0) {
                    drawY -= Math.sin(b.bounceTimer) * 5;
                    b.bounceTimer -= 1;
                }

                if (b.type === 'ground') {
                    let grad = ctx.createLinearGradient(0, drawY, 0, drawY + b.h);
                    grad.addColorStop(0, '#2ecc71'); // Трава
                    grad.addColorStop(0.1, '#27ae60');
                    grad.addColorStop(0.15, '#8e44ad'); // Земля (стилизованная)
                    grad.addColorStop(1, '#2c3e50');
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.roundRect(b.x, drawY, b.w, b.h + 50, 8);
                    ctx.fill();
                } 
                else if (b.type === 'brick') {
                    ctx.fillStyle = '#d35400';
                    ctx.beginPath();
                    ctx.roundRect(b.x, drawY, b.w, b.h, 4);
                    ctx.fill();
                    // Текстура кирпича
                    ctx.strokeStyle = 'rgba(0,0,0,0.3)';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(b.x, drawY, b.w, b.h);
                    ctx.beginPath();
                    ctx.moveTo(b.x + b.w/2, drawY); ctx.lineTo(b.x + b.w/2, drawY + b.h);
                    ctx.moveTo(b.x, drawY + b.h/2); ctx.lineTo(b.x + b.w, drawY + b.h/2);
                    ctx.stroke();
                }
                else if (b.type === 'loot_box') {
                    ctx.fillStyle = b.active ? '#f1c40f' : '#bdc3c7';
                    ctx.beginPath();
                    ctx.roundRect(b.x, drawY, b.w, b.h, 6);
                    ctx.fill();
                    // Внутренний квадрат
                    ctx.strokeStyle = b.active ? '#f39c12' : '#95a5a6';
                    ctx.lineWidth = 4;
                    ctx.strokeRect(b.x + 6, drawY + 6, b.w - 12, b.h - 12);
                    
                    if (b.active) {
                        ctx.fillStyle = '#e67e22';
                        ctx.font = 'bold 30px Arial';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.shadowBlur = 0;
                        ctx.fillText('?', b.x + b.w/2, drawY + b.h/2 + 2);
                    }
                }
                ctx.shadowBlur = 0; // Отключаем тень для остальных элементов
            }

            // Отрисовка трюфелей (предметов)
            for (let item of items) {
                let grad = ctx.createRadialGradient(item.x+10, item.y+10, 2, item.x+10, item.y+10, 10);
                grad.addColorStop(0, '#ffd700'); // Золотой центр
                grad.addColorStop(1, '#d35400'); // Темный край
                
                ctx.fillStyle = grad;
                ctx.shadowColor = '#f1c40f';
                ctx.shadowBlur = 15;
                ctx.beginPath();
                ctx.arc(item.x + 10, item.y + 10, 10, 0, Math.PI*2);
                ctx.fill();
                ctx.shadowBlur = 0;
            }

            // --- РЕАЛИСТИЧНАЯ СВИНКА НА ДВУХ НОГАХ ---
            ctx.save();
            ctx.translate(pig.x + pig.width / 2, pig.y + pig.height); // Центр внизу ног
            if (!pig.facingRight) ctx.scale(-1, 1);

            let swing = (pig.isGrounded && Math.abs(pig.vx) > 0.5) ? Math.sin(time * 6) * 15 : 0;
            let breathe = Math.sin(time * 2) * 2;

            // Цвета реалистичной кожи
            let skinBase = '#f8a5c2';
            let skinDark = '#e77f67';

            // Дальняя рука и нога
            ctx.fillStyle = skinDark;
            ctx.beginPath(); // Дальняя нога
            ctx.roundRect(-5 - swing/2, -15, 8, 15, 4);
            ctx.fill();
            ctx.beginPath(); // Дальняя рука
            ctx.roundRect(0 + swing, -40 + breathe, 6, 20, 4);
            ctx.fill();

            // Туловище (реалистичный овал)
            let bodyGrad = ctx.createLinearGradient(-15, -50, 15, -15);
            bodyGrad.addColorStop(0, '#f8a5c2');
            bodyGrad.addColorStop(1, '#cf6a87');
            ctx.fillStyle = bodyGrad;
            ctx.beginPath();
            ctx.ellipse(0, -35 + breathe, 16, 22, 0, 0, Math.PI*2);
            ctx.fill();
            
            // Животик (светлый)
            ctx.fillStyle = 'rgba(255,255,255,0.3)';
            ctx.beginPath();
            ctx.ellipse(5, -35 + breathe, 8, 16, Math.PI/12, 0, Math.PI*2);
            ctx.fill();

            // Голова
            ctx.fillStyle = skinBase;
            ctx.beginPath();
            ctx.ellipse(5, -58 + breathe, 14, 14, 0, 0, Math.PI*2);
            ctx.fill();
            
            // Ушки
            ctx.fillStyle = skinDark;
            ctx.beginPath();
            ctx.moveTo(0, -68 + breathe);
            ctx.lineTo(-10, -78 + breathe);
            ctx.lineTo(-6, -62 + breathe);
            ctx.fill();

            // Пятачок (вытянутый вперед)
            let noseGrad = ctx.createLinearGradient(12, -65, 22, -55);
            noseGrad.addColorStop(0, '#f78fb3');
            noseGrad.addColorStop(1, '#e66767');
            ctx.fillStyle = noseGrad;
            ctx.beginPath();
            ctx.ellipse(16, -56 + breathe, 7, 6, Math.PI/6, 0, Math.PI*2);
            ctx.fill();
            // Ноздри
            ctx.fillStyle = '#c44569';
            ctx.beginPath(); ctx.arc(18, -57 + breathe, 1.5, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(15, -55 + breathe, 1.5, 0, Math.PI*2); ctx.fill();

            // Глаз
            ctx.fillStyle = 'white';
            ctx.beginPath(); ctx.arc(9, -62 + breathe, 4, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#303952';
            ctx.beginPath(); ctx.arc(10, -62 + breathe, 2, 0, Math.PI*2); ctx.fill();

            // Ближняя нога и рука
            ctx.fillStyle = skinBase;
            ctx.beginPath(); // Ближняя нога
            ctx.roundRect(-3 + swing/2, -16, 9, 16, 4);
            ctx.fill();
            // Копытце
            ctx.fillStyle = '#596275';
            ctx.fillRect(-3 + swing/2 + 4, -4, 5, 4);

            ctx.beginPath(); // Ближняя рука
            ctx.roundRect(-2 - swing, -42 + breathe, 7, 22, 4);
            ctx.fill();

            ctx.restore();
            ctx.restore();
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
