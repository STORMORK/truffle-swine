  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- TELEGRAM SDK HELPERS ---
    function initTelegram() {
      if (window.Telegram && window.Telegram.WebApp) {
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        try {
          tg.headerColor = '#0f172a';
          tg.backgroundColor = '#020617';
        } catch (e) {}
      }
    }

    function triggerHaptic(type = 'light') {
      if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.HapticFeedback) {
        const haptic = window.Telegram.WebApp.HapticFeedback;
        if (type === 'success' || type === 'error') {
          haptic.notificationOccurred(type);
        } else {
          haptic.impactOccurred(type);
        }
      }
    }

    // --- WEB AUDIO API SFX SYNTHESIZER ---
    let audioCtx = null;
    let soundEnabled = true;

    function getAudioContext() {
      if (!audioCtx) {
        const AudioClass = window.AudioContext || window.webkitAudioContext;
        if (AudioClass) audioCtx = new AudioClass();
      }
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function playCannonSFX() {
      if (!soundEnabled) return;
      const ctx = getAudioContext();
      if (!ctx) return;
      const now = ctx.currentTime;

      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(150, now);
      osc.frequency.exponentialRampToValueAtTime(30, now + 0.4);

      gain.gain.setValueAtTime(0.8, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);

      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.5);
    }

    function playCoinSFX() {
      if (!soundEnabled) return;
      const ctx = getAudioContext();
      if (!ctx) return;
      const now = ctx.currentTime;

      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(987.77, now);
      osc.frequency.setValueAtTime(1318.51, now + 0.08);

      gain.gain.setValueAtTime(0.3, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);

      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.25);
    }

    // --- GAME DATA CONFIGURATIONS ---
    const SHIP_CLASSES = {

      schooner: { name: 'Шхуна "Морская Тень"', baseHp: 600, baseSpeed: 12, cannons: 12, costGold: 1500, costWood: 900, icon: '⛵' },

    const QUESTS = [

      { id: 'q2', title: 'Поиски Сокровищ Генри Моргана', desc: 'Старая карта указывает на затерянный риф.', gold: 1500, exp: 200, energy: 15 },

    const WORLD_TILES = [
      { id: 'w1', name: 'Тортуга (Порт)', icon: '🏝️', danger: 0 },
      { id: 'w2', name: 'Риф Мертвеца', icon: '⚓', danger: 1 },

    const DEFAULT_PLAYER = {

      title: 'Юнга',
      level: 1,
      exp: 0,
      maxExp: 100,
      infamy: 150,
      gold: 1500,

      rum: 500,
      energy: 50,
      maxEnergy: 50,
      buildings: { tavern: 1, shipyard: 1, gold_mine: 1, sawmill: 1, rum_distillery: 1 },

    // --- MAIN APP COMPONENT ---
    function App() {
      const [player, setPlayer] = useState(() => {
        const saved = localStorage.getItem('PIRATES_GAME_STATE');
        return saved ? JSON.parse(saved) : DEFAULT_PLAYER;
      });

      const [activeTab, setActiveTab] = useState('island');
      const [interactiveEnemy, setInteractiveEnemy] = useState(null);
      const [battleModal, setBattleModal] = useState(null);

      useEffect(() => {
        initTelegram();
      }, []);

      useEffect(() => {
        localStorage.setItem('PIRATES_GAME_STATE', JSON.stringify(player));
      }, [player]);

      // Passive resource tick
      useEffect(() => {
        const interval = setInterval(() => {
          setPlayer(prev => ({
            ...prev,
            gold: prev.gold + (prev.buildings.gold_mine || 1) * 5,
            wood: prev.wood + (prev.buildings.sawmill || 1) * 3,
            rum: prev.rum + (prev.buildings.rum_distillery || 1) * 2,
            energy: Math.min(prev.maxEnergy, prev.energy + 1)
          }));
        }, 5000);
        return () => clearInterval(interval);
      }, []);

      const collectDues = () => {
        triggerHaptic('medium');
        playCoinSFX();
        setPlayer(prev => ({
          ...prev,
          gold: prev.gold + 500,
          wood: prev.wood + 300,
          rum: prev.rum + 150,
          exp: prev.exp + 25
        }));
      };

      const upgradeBuilding = (bId) => {
        const cfg = BUILDINGS[bId];
        const lvl = player.buildings[bId] || 1;
        const gCost = cfg.goldCost * lvl;
        const wCost = cfg.woodCost * lvl;

        if (player.gold >= gCost && player.wood >= wCost) {
          triggerHaptic('medium');
          playCoinSFX();
          setPlayer(prev => ({
            ...prev,
            gold: prev.gold - gCost,
            wood: prev.wood - wCost,
            buildings: { ...prev.buildings, [bId]: lvl + 1 }
          }));
        }
      };

      const startInteractiveBattle = (enemy) => {
        setInteractiveEnemy(enemy);
      };

      return (
        <div className="flex flex-col min-h-screen">
          {/* HEADER */}
          <header className="sticky top-0 z-40 bg-slate-950/95 backdrop-blur-md border-b border-amber-900/40 p-3 select-none">
            <div className="flex items-center justify-between mb-2">
              <div className="flex items-center gap-2">
                <div className="w-10 h-10 rounded-full bg-amber-600 border border-amber-400 flex items-center justify-center font-black text-slate-950">
                  {player.level}
                </div>
                <div>
                  <div className="font-extrabold text-sm text-amber-200">{player.name}</div>
                  <div className="text-[10px] text-amber-400 bg-amber-950/80 px-1.5 py-0.2 rounded border border-amber-800">{player.title}</div>
                </div>
              </div>
              <div className="bg-amber-950/80 border border-amber-800 px-2.5 py-1 rounded-full text-xs text-amber-300 font-bold">
                Слава: 🔥 {player.infamy}
              </div>
            </div>

            {/* RESOURCE STRIP */}
            <div className="grid grid-cols-4 gap-1 text-[11px] bg-slate-900 p-1.5 rounded-lg border border-amber-900/40 font-bold text-center">
              <div className="text-yellow-400">💰 {player.gold}</div>
              <div className="text-emerald-400">🪵 {player.wood}</div>
              <div className="text-rose-400">🍾 {player.rum}</div>
              <div className="text-cyan-400">⚡ {player.energy}/{player.maxEnergy}</div>
            </div>
          </header>

          {/* CONTENT AREA */}
          <main className="flex-1 p-3 pb-24 overflow-y-auto">
            {activeTab === 'island' && (

                <div className="bg-gradient-to-b from-slate-900 to-amber-950/40 border border-amber-800/50 p-4 rounded-2xl shadow-xl">
                  <div className="flex items-center justify-between mb-2">
                    <h2 className="text-lg font-black text-amber-100">🏝️ Остров Тортуга</h2>
                    <button onClick={collectDues} className="bg-amber-500 hover:bg-amber-400 text-slate-950 font-black px-3 py-1.5 rounded-xl text-xs shadow-md">
                      ✨ Собрать Дань
                    </button>
                  </div>
                  <p className="text-xs text-amber-200/80">Развивайте постройки для укрепления флотской мощи.</p>
                </div>

                <div className="space-y-2.5">
                  <h3 className="text-xs font-bold text-amber-300 uppercase">Постройки Острова</h3>
                  {Object.keys(BUILDINGS).map(bId => {
                    const cfg = BUILDINGS[bId];
                    const lvl = player.buildings[bId] || 1;
                    const gCost = cfg.goldCost * lvl;
                    const wCost = cfg.woodCost * lvl;

            {activeTab === 'shipyard' && (

                          <div className="font-bold text-amber-100 text-sm">{ship.name}</div>
                          <div className="text-xs text-slate-300">Прочность: {ship.hp}/{ship.maxHp} HP | Орудий: {ship.cannons}</div>
                        </div>

            {activeTab === 'quests' && (

                      </div>
                      <p className="text-xs text-slate-300">{q.desc}</p>
                      <div className="flex justify-between items-center pt-2 border-t border-amber-900/30">
                        <span className="text-xs text-yellow-300 font-bold">Награда: +{q.gold} 💰</span>
                        <button
                          onClick={() => startInteractiveBattle({ name: q.title, hp: 600, maxHp: 600, cannons: 12 })}

                        >
                          ⚔️ Атаковать
                        </button>
                      </div>
                    </div>
                  ))}

            )}

            {activeTab === 'profile' && (
              <div className="space-y-4 bg-slate-900 p-4 rounded-2xl border border-amber-900/40 text-center">

                  ☠️
                </div>
                <h2 className="text-xl font-black text-amber-100">{player.name}</h2>
                <p className="text-xs text-amber-400">{player.title} • Уровень {player.level}</p>
                <div className="text-xs text-slate-300 bg-slate-950 p-3 rounded-xl border border-amber-900/30">
                  Морская Слава: 🔥 {player.infamy}<br/>
                  Дублонов в сундуке: 💰 {player.gold}
                </div>
              </div>
            )}
          </main>

          {/* BOTTOM NAVIGATION */}
          <nav className="fixed bottom-0 left-0 right-0 max-w-lg mx-auto bg-slate-950/95 border-t border-amber-900/40 grid grid-cols-4 p-2 gap-1 text-center font-bold text-xs">
            <button onClick={() => { triggerHaptic(); setActiveTab('island'); }} className={`py-2 rounded-lg ${activeTab === 'island' ? 'bg-amber-600 text-slate-950' : 'text-slate-400'}`}>
              🏝️ Остров
            </button>
            <button onClick={() => { triggerHaptic(); setActiveTab('shipyard'); }} className={`py-2 rounded-lg ${activeTab === 'shipyard' ? 'bg-amber-600 text-slate-950' : 'text-slate-400'}`}>
              ⚓ Флот
            </button>
            <button onClick={() => { triggerHaptic(); setActiveTab('quests'); }} className={`py-2 rounded-lg ${activeTab === 'quests' ? 'bg-amber-600 text-slate-950' : 'text-slate-400'}`}>
              🗺️ Карты
            </button>
            <button onClick={() => { triggerHaptic(); setActiveTab('profile'); }} className={`py-2 rounded-lg ${activeTab === 'profile' ? 'bg-amber-600 text-slate-950' : 'text-slate-400'}`}>
              ☠️ Профиль
            </button>
          </nav>

          {/* INTERACTIVE 2D CANTON CANVAS BATTLE MODAL */}
          {interactiveEnemy && (
            <InteractiveBattleModal
              player={player}
              enemy={interactiveEnemy}
              onClose={(won) => {
                if (won) {
                  playCoinSFX();
                  setPlayer(p => ({ ...p, gold: p.gold + 1200, exp: p.exp + 250, infamy: p.infamy + 50 }));
                }
                setInteractiveEnemy(null);
              }}
            />
          )}
        </div>
      );
    }

    // --- INTERACTIVE 2D CANVAS BATTLE COMPONENT ---
    function InteractiveBattleModal({ player, enemy, onClose }) {
      const canvasRef = useRef(null);
      const [playerHp, setPlayerHp] = useState(player.fleet[0]?.hp || 350);
      const [enemyHp, setEnemyHp] = useState(enemy.hp || 500);
      const [reload, setReload] = useState(100);
      const [isOver, setIsOver] = useState(false);

      const pPos = useRef({ x: 100, y: 150, angle: 0 });
      const ePos = useRef({ x: 260, y: 150, angle: Math.PI });
      const balls = useRef([]);

      useEffect(() => {
        const timer = setInterval(() => {
          setReload(prev => Math.min(100, prev + 15));
        }, 200);
        return () => clearInterval(timer);
      }, []);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animId;

        const loop = () => {
          canvas.width = canvas.parentElement.clientWidth || 320;
          canvas.height = 280;

          ctx.fillStyle = '#0f172a';
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          // Render Player Ship
          ctx.save();
          ctx.translate(pPos.current.x, pPos.current.y);
          ctx.rotate(pPos.current.angle);
          ctx.fillStyle = '#f59e0b';
          ctx.fillRect(-10, -6, 20, 12);
          ctx.restore();

          // Render Enemy Ship
          ctx.save();
          ctx.translate(ePos.current.x, ePos.current.y);
          ctx.rotate(ePos.current.angle);
          ctx.fillStyle = '#ef4444';
