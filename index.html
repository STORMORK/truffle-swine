<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Truffle Swine Pro</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #0d1b2a; }
        canvas { display: block; width: 100vw; height: 100vh; z-index: 1; }
        .ui-layer { position: absolute; top: 0; left: 0; width: 100%; pointer-events: none; padding: 18px 22px; z-index: 2; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; font-family: 'Segoe UI', Roboto, sans-serif; font-size: 22px; font-weight: 900; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
        .badge { background: rgba(0, 0, 0, 0.4); padding: 8px 16px; border-radius: 24px; backdrop-filter: blur(6px); border: 1px solid rgba(255,255,255,0.2); }
        .score span { color: #ffd700; }
        .hint { position: absolute; bottom: 20px; width: 100%; text-align: center; color: rgba(255,255,255,0.6); font-family: sans-serif; font-size: 13px; pointer-events: none; text-shadow: 0 1px 2px rgba(0,0,0,0.8); }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <div class="ui-layer">
        <div class="top-bar">
            <div class="badge">🐷 Truffle Swine Pro</div>
            <div class="badge score">Трюфели: <span id="coinsText">0</span></div>
        </div>
    </div>
    <div class="hint">Быстрый свайп влево/вправо — стремительный бег | Свайп вверх — высокий прыжок</div>

    <script src="input.js"></script>
    <script src="engine.js"></script>
</body>
</html>
