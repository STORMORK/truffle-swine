<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Super HD Piggy Platformer</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            pointer-events: none;
            padding: 20px;
            z-index: 2;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            font-family: 'Segoe UI', Roboto, sans-serif;
            font-size: 24px;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 4px 6px rgba(0,0,0,0.8);
        }
        .score span { color: #ffd700; }
        
        .hint {
            position: absolute;
            bottom: 40px;
            width: 100%;
            text-align: center;
            color: rgba(255,255,255,0.7);
            font-family: sans-serif;
            font-size: 15px;
            pointer-events: none;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <div class="ui-layer">
        <div class="top-bar">
            <div class="score">SUPER PIG</div>
            <div class="score">Трюфели: <span id="coinsText">0</span></div>
        </div>
    </div>
    <div class="hint">Свайп в стороны — бег | Свайп вверх — прыжок</div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let logicalWidth, logicalHeight;
        function resizeCanvas() {
            logicalWidth = window.innerWidth;
            logicalHeight = window.innerHeight;
            const dpr = window.devicePixelRatio || 1;
            canvas.width = logicalWidth * dpr;
            canvas.height = logicalHeight * dpr;
            ctx.scale(dpr, dpr);
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Сбалансированная динамичная физика (средний/быстрый темп)
        const GRAVITY = 0.65;
        const FRICTION = 0.82;
        const JUMP_POWER = -13.5;
        const MOVE_SPEED = 1.2;  // Быстрый набор скорости
        const MAX_SPEED = 6.0;   // Отличная бодрая скорость бега

        let scoreCoins = 0;
        let time = 0;
        let cameraX = 0;

        // Управление свайпами
        let isTouching = false;
        let touchStart = { x: 0, y: 0 };
        let touchOffset = { x: 0, y: 0 };

        window.addEventListener('touchstart', e => {
            touchStart.x = e.touches[0].clientX;
            touchStart.y = e.touches[0].clientY;
            touchOffset.x = 0;
            touchOffset.y = 0;
            isTouching = true;
        });

        window.addEventListener('touchmove', e => {
            if(!isTouching) return;
            let currentX = e.touches[0].clientX;
            let currentY = e.touches[0].clientY;
            
            touchOffset.x = currentX - touchStart.x;
            touchOffset.y = currentY - touchStart.y;

            // Прыжок по резкому свайпу вверх
            if (touchOffset.y < -30 && pig.isGrounded) {
                pig.vy = JUMP_POWER;
                pig.isGrounded = false;
                touchStart.y = currentY;
            }
        });

        window.addEventListener('touchend', () => {
            isTouching = false;
            touchOffset.x = 0;
            touchOffset.y = 0;
        });

        // Свинка
        let pig = {
            x: 50, y: 200, 
            width: 32, height: 58,
            vx: 0, vy: 0,
            isGrounded: false,
            facingRight: true
        };

        const blockSize = 48;
        let blocks = [];
        let items = [];

        function createLevel() {
            blocks = [];
            items = [];
            // Земля с интересными провалами
            for(let i=0; i<120; i++) {
                if(i !== 9 && i !== 10 && i !== 22 && i !== 23 && i !== 35) {
                    blocks.push({ x: i * blockSize, y: logicalHeight - blockSize*2, w: blockSize, h: blockSize*4, type: 'ground' });
                }
            }
            // Платформы и ящики с лутом
            blocks.push({ x: 280, y: logicalHeight - blockSize*5, w: blockSize*4, h: blockSize, type: 'brick' });
            blocks.push({ x: 360, y: logicalHeight - blockSize*5, w: blockSize, h: blockSize, type: 'loot_box', active: true, bounceTimer: 0 });
            
            blocks.push({ x: 650, y: logicalHeight - blockSize*6.5, w: blockSize, h: blockSize, type: 'loot_box', active: true, bounceTimer: 0 });
            blocks.push({ x: 900, y: logicalHeight - blockSize*4.5, w: blockSize*3, h: blockSize, type: 'brick' });
        }
        createLevel();

        function checkCollision(r1, r2) {
            return (
                r1.x < r2.x + r2.w &&
                r1.x + r1.width > r2.x &&
                r1.y < r2.y + r2.h &&
                r1.y + r1.height > r2.y
            );
        }

        function update() {
            time += 0.1;

            // Обработка движения от пальца
            if (isTouching) {
                if (touchOffset.x > 15) {
                    pig.vx += MOVE_SPEED;
                    pig.facingRight = true;
                } else if (touchOffset.x < -15) {
                    pig.vx -= MOVE_SPEED;
                    pig.facingRight = false;
                }
            }
            
            pig.vx *= FRICTION;
            if (pig.vx > MAX_SPEED) pig.vx = MAX_SPEED;
            if (pig.vx < -MAX_SPEED) pig.vx = -MAX_SPEED;
            if (Math.abs(pig.vx) < 0.15) pig.vx = 0;

            pig.vy += GRAVITY;

            // Движение по X и коллизии со стенами
            pig.x += pig.vx;
            for (let b of blocks) {
                if (checkCollision(pig, b)) {
                    if (pig.vx > 0) { pig.x = b.x - pig.width; pig.vx = 0; } 
                    else if (pig.vx < 0) { pig.x = b.x + b.w; pig.vx = 0; }
                }
            }

            // Движение по Y и коллизии с землей/блоками
            pig.y += pig.vy;
            pig.isGrounded = false;
            
            for (let b of blocks) {
                if (checkCollision(pig, b)) {
                    if (pig.vy > 0) { // Приземление
                        pig.y = b.y - pig.height;
                        pig.vy = 0;
                        pig.isGrounded = true;
                    } else if (pig.vy < 0) { // Удар головой снизу
                        pig.y = b.y + b.h;
                        pig.vy = 0;
                        
                        // Если ударили активный ящик с вопросом
                        if (b.type === 'loot_box' && b.active) {
                            b.active = false;
                            b.bounceTimer = 12; // Анимация прыжка ящика
                            
                            // Спавн трюфеля, который выпрыгивает из ящика вверх и падает
                            items.push({
                                x: b.x + blockSize / 2 - 12,
                                y: b.y - 10,
                                w: 24, h: 24,
                                vx: (Math.random() - 0.5) * 2,
                                vy: -7, // Эффект выпрыгивания
                                collected: false
                            });
                        }
                    }
                }
            }

            // Физика выпадающих трюфелей
            for (let i = items.length - 1; i >= 0; i--) {
                let item = items[i];
                item.vy += GRAVITY;
                item.x += item.vx;
                item.y += item.vy;

                // Столкновение трюфеля с блоками (лежит на платформе)
                for (let b of blocks) {
                    if (checkCollision(item, b) && item.vy > 0) {
                        item.y = b.y - item.h;
                        item.vy = 0;
                        item.vx = 0;
                    }
                }

                // Сбор трюфеля свинкой
                if (checkCollision(pig, item)) {
                    scoreCoins++;
                    document.getElementById('coinsText').innerText = scoreCoins;
                    items.splice(i, 1);
                }
            }

            // Падение в пропасть
            if (pig.y > logicalHeight + 100) {
                pig.x = 50; pig.y = 100;
                pig.vx = 0; pig.vy = 0;
                createLevel();
            }

            // Плавное следование камеры за свинкой
            let targetCameraX = pig.x - logicalWidth * 0.38;
            if (targetCameraX < 0) targetCameraX = 0;
            cameraX += (targetCameraX - cameraX) * 0.12;
        }

        function draw() {
            // Градиент неба
            let skyGrad = ctx.createLinearGradient(0, 0, 0, logicalHeight);
            skyGrad.addColorStop(0, '#0abde3');
            skyGrad.addColorStop(1, '#54a0ff');
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, logicalWidth, logicalHeight);

            ctx.save();
            ctx.translate(-cameraX, 0);

            // Параллакс облака
            ctx.fillStyle = "rgba(255, 255, 255, 0.3)";
            for(let i=0; i<12; i++) {
                ctx.beginPath();
                ctx.arc(80 + i*280 + cameraX*0.6, 120 + (i%3)*30, 50, 0, Math.PI*2);
                ctx.arc(130 + i*280 + cameraX*0.6, 120 + (i%3)*30, 70, 0, Math.PI*2);
                ctx.arc(180 + i*280 + cameraX*0.6, 120 + (i%3)*30, 45, 0, Math.PI*2);
                ctx.fill();
            }

            // Отрисовка блоков мира
            for (let b of blocks) {
                if (b.x + b.w < cameraX || b.x > cameraX + logicalWidth) continue;

                let drawY = b.y;
                if (b.bounceTimer > 0) {
                    drawY -= Math.sin((b.bounceTimer / 12) * Math.PI) * 8;
                    b.bounceTimer--;
                }

                if (b.type === 'ground') {
                    let grad = ctx.createLinearGradient(0, drawY, 0, drawY + b.h);
                    grad.addColorStop(0, '#10ac84'); // Трава
                    grad.addColorStop(0.08, '#01a3a4');
                    grad.addColorStop(1, '#222f3e');  // Земля
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.roundRect(b.x, drawY, b.w, b.h + 40, 6);
                    ctx.fill();
                } 
                else if (b.type === 'brick') {
                    ctx.fillStyle = '#e55039';
                    ctx.beginPath();
                    ctx.roundRect(b.x, drawY, b.w, b.h, 4);
                    ctx.fill();
                    ctx.strokeStyle = '#b71540';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(b.x, drawY, b.w, b.h);
                }
                else if (b.type === 'loot_box') {
                    ctx.fillStyle = b.active ? '#feca57' : '#8395a7';
                    ctx.beginPath();
                    ctx.roundRect(b.x, drawY, b.w, b.h, 6);
                    ctx.fill();
                    ctx.strokeStyle = b.active ? '#ff9f43' : '#576574';
                    ctx.lineWidth = 4;
                    ctx.strokeRect(b.x + 4, drawY + 4, b.w - 8, b.h - 8);
                    
                    if (b.active) {
                        ctx.fillStyle = '#ee5253';
                        ctx.font = 'bold 28px Arial';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText('?', b.x + b.w/2, drawY + b.h/2 + 2);
                    }
                }
            }

            // Отрисовка выпрыгнувших и падающих трюфелей
            for (let item of items) {
                ctx.save();
                ctx.translate(item.x + 12, item.y + 12);
                let pulse = 1 + Math.sin(time * 5) * 0.1;
                ctx.scale(pulse, pulse);

                let grad = ctx.createRadialGradient(0, 0, 2, 0, 0, 12);
                grad.addColorStop(0, '#fffa65');
                grad.addColorStop(1, '#ffb142');
                ctx.fillStyle = grad;
                ctx.shadowColor = '#feca57';
                ctx.shadowBlur = 12;
                ctx.beginPath();
                ctx.arc(0, 0, 11, 0, Math.PI*2);
                ctx.fill();
                ctx.restore();
            }

            // --- СВИНКА В HD КАЧЕСТВЕ (Стоит на двух ногах) ---
            ctx.save();
            ctx.translate(pig.x + pig.width / 2, pig.y + pig.height);
            if (!pig.facingRight) ctx.scale(-1, 1);

            let runAnim = (pig.isGrounded && Math.abs(pig.vx) > 0.5) ? Math.sin(time * 12) * 18 : 0;
            let breathe = Math.sin(time * 3) * 2;

            let skinMain = '#ff9ff3';
            let skinDark = '#f368e0';

            // Дальняя нога и рука
            ctx.fillStyle = '#ff6b81';
            ctx.beginPath();
            ctx.roundRect(-4 - runAnim/2, -16, 8, 16, 4);
            ctx.fill();

            ctx.beginPath();
            ctx.roundRect(2 + runAnim, -42 + breathe, 6, 20, 3);
            ctx.fill();

            // Тело
            ctx.fillStyle = skinMain;
            ctx.beginPath();
            ctx.ellipse(0, -36 + breathe, 15, 21, 0, 0, Math.PI*2);
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#fff';
            ctx.stroke();

            // Голова
            ctx.beginPath();
            ctx.ellipse(4, -58 + breathe, 13, 13, 0, 0, Math.PI*2);
            ctx.fill();
            ctx.stroke();

            // Ухо
            ctx.fillStyle = skinDark;
            ctx.beginPath();
            ctx.moveTo(-1, -67 + breathe);
            ctx.lineTo(-10, -77 + breathe);
            ctx.lineTo(-5, -61 + breathe);
            ctx.fill();

            // Пятачок
            ctx.fillStyle = '#ff7979';
            ctx.beginPath();
            ctx.ellipse(15, -56 + breathe, 6, 7, Math.PI/6, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = '#eb4d4b';
            ctx.fillRect(16, -58 + breathe, 2, 2);
            ctx.fillRect(16, -54 + breathe, 2, 2);

            // Глаз
            ctx.fillStyle = '#fff';
            ctx.beginPath(); ctx.arc(8, -61 + breathe, 4, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#222';
            ctx.beginPath(); ctx.arc(9, -61 + breathe, 2, 0, Math.PI*2); ctx.fill();

            // Ближняя нога и рука
            ctx.fillStyle = skinMain;
            ctx.beginPath();
            ctx.roundRect(-2 + runAnim/2, -16, 9, 16, 4);
            ctx.fill();
            ctx.strokeStyle = '#fff';
            ctx.stroke();

            ctx.beginPath();
            ctx.roundRect(-3 - runAnim, -43 + breathe, 7, 22, 3);
            ctx.fill();
            ctx.stroke();

            ctx.restore();
            ctx.restore();
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
